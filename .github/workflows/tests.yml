name: Tests

on:
  push:
    branches:
      - main
      - feature/step14-ranked-matchmaking
      - fix/gameplay-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Show revision under test
        run: git rev-parse HEAD

      - name: Initialize clean development database
        run: python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("archess_app", "game.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          from config.config import DevelopmentConfig
          application = module.create_app(DevelopmentConfig)
          with application.app_context():
              module.db.drop_all()
              module.db.create_all()
          PY

      - name: Run Python tests
        env:
          RUN_BROWSER_MATRIX: "0"
        run: python -m pytest -q

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Start Flask server
        run: |
          nohup python - <<'PY' > flask.log 2>&1 &
          import importlib.util
          spec = importlib.util.spec_from_file_location("archess_app", "game.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          app = module.create_app()
          app.run(host="127.0.0.1", port=5000)
          PY

      - name: Wait for Flask server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat flask.log
          exit 1

      - name: Run browser matrix
        env:
          RUN_BROWSER_MATRIX: "1"
        run: python -m pytest tests/test_browser_matrix.py tests/test_auth_browser.py tests/test_3d_runtime.py tests/test_local_gameplay_browser.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run JavaScript tests
        env:
          NODE_OPTIONS: "--require ./tests/node-dom-shim.cjs"
        run: node --test tests/physics.test.js tests/replay.test.js
