name: Tests

on:
  push:
    branches:
      - main
      - feature/step14-ranked-matchmaking
      - fix/gameplay-final
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Show revision under test
        run: git rev-parse HEAD

      - name: Initialize clean development database
        run: >-
          python -c "import importlib.util; s=importlib.util.spec_from_file_location('archess_app','game.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); from config.config import DevelopmentConfig; a=m.create_app(DevelopmentConfig); c=a.app_context(); c.push(); m.db.drop_all(); m.db.create_all(); c.pop()"

      - name: Run Python tests
        env:
          RUN_BROWSER_MATRIX: "0"
        run: python -m pytest -q

      - name: Install Playwright browsers
        run: python -m playwright install chromium firefox webkit

      - name: Start Flask server
        run: >-
          nohup python -c "import importlib.util; s=importlib.util.spec_from_file_location('archess_app','game.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); m.create_app().run(host='127.0.0.1',port=5000)" > flask.log 2>&1 &

      - name: Wait for Flask server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/version > /dev/null; then exit 0; fi
            sleep 1
          done
          cat flask.log
          exit 1

      - name: Run browser matrix and gameplay regression
        env:
          RUN_BROWSER_MATRIX: "1"
        run: python -m pytest tests/test_browser_matrix.py tests/test_auth_browser.py tests/test_3d_runtime.py tests/test_local_gameplay_browser.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run all JavaScript tests
        env:
          NODE_OPTIONS: "--require ./tests/node-dom-shim.cjs"
        run: node --test tests/*.test.js
