name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Start Flask server
        run: python -m flask --app app run --host 127.0.0.1 --port 5000 > flask.log 2>&1 &

      - name: Wait for Flask server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/version > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat flask.log
          exit 1

      - name: Run browser matrix
        run: python -m pytest tests/test_browser_matrix.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JavaScript tests
        run: npm run test:physics
