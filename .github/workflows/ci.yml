name: ArChess CI / CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit pip-audit
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,.git,__pycache__,scratch
          # Warn on general PEP8 issues without breaking
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=.venv,venv,.git,__pycache__,scratch

      - name: Automated SAST Security Scan (Bandit)
        run: |
          bandit -r backend/ run.py -ll

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt


      - name: Run Test Suite with Coverage
        env:
          SECRET_KEY: test-ci-secret-key-32-chars-long-abc
          FLASK_ENV: testing
        run: |
          python -m pytest tests/ --cov=backend --cov-report=term-missing -v

  docker:
    name: Build Docker Container
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        
      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: archess:latest
