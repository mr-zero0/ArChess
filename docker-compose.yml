services:
  archess:
    build:
      context: .
      dockerfile: Dockerfile
    image: archess:4.0.0
    container_name: archess-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_ENV=production
      - PRODUCTION=1
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_secure_random_hex_key}
      - ARCHESS_DB_PATH=/app/data/archess.db
      - WSGI_THREADS=16
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - archess-data:/app/data
      - archess-logs:/app/Logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  archess-data:
    driver: local
  archess-logs:
    driver: local
