<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArChess — Profile</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#111827;--panel2:#0b1220;--line:#243149;--text:#f8fafc;--muted:#94a3b8;--a:#8b5cf6;--b:#2563eb;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a1020,#070b12 55%);color:var(--text);font:15px Inter,system-ui,sans-serif}.wrap{width:min(1280px,100%);margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:25px;font-weight:800}.actions{display:flex;gap:8px}.button{padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.card{background:rgba(17,24,39,.9);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 16px 50px #0003}.identity{text-align:center}.avatar{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:radial-gradient(circle at 35% 30%,#a78bfa,#312e81 55%,#0f172a);font-size:38px}.name{font-size:25px;font-weight:800}.bio{color:var(--muted);line-height:1.5;margin:8px 0 16px}.tier{display:inline-flex;gap:7px;align-items:center;padding:7px 11px;border-radius:999px;background:#7c3aed22;color:#ddd6fe}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:22px}.muted{color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.list{display:grid;gap:8px;max-height:360px;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--panel2);border:1px solid #1e293b}.result-win{color:var(--green)}.result-loss{color:#f87171}.social{display:grid;gap:10px}.input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:#fff}.challenge{display:flex;gap:8px}.graph{height:230px;width:100%;background:var(--panel2);border-radius:14px;border:1px solid var(--line);padding:10px}.empty{color:var(--muted);padding:20px;text-align:center}.danger{color:#fecaca}.section-title{font-size:18px;font-weight:750;margin-bottom:13px}@media(max-width:950px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="wrap"><div class="top"><div class="brand">ArChess / Profile</div><div class="actions"><button class="button" onclick="location.href='/'">Back to game</button><button class="button" id="logout">Logout</button></div></div>
<div class="grid"><aside class="card identity"><div class="avatar" id="avatar">♞</div><div class="name" id="name">Loading…</div><div class="tier" id="tier">—</div><div class="bio" id="bio"></div><div class="muted" id="joined"></div><div style="margin-top:14px"><button class="button" onclick="editProfile()">Edit profile</button></div><div class="stats"><div class="stat"><b id="mmr">-</b><span class="muted">MMR</span></div><div class="stat"><b id="matches">-</b><span class="muted">Matches</span></div><div class="stat"><b id="winrate">-</b><span class="muted">Win rate</span></div><div class="stat"><b id="level">-</b><span class="muted">Level</span></div></div></aside>
<main><div class="card"><div class="section-title">MMR performance</div><div class="graph"><canvas id="mmrGraph"></canvas></div></div>
<div class="two"><div class="card"><div class="section-title">Match history</div><div class="list" id="history"></div></div><div class="card"><div class="section-title">Friends</div><div class="social"><input class="input" id="friendSearch" placeholder="Search username…"><div class="list" id="friendResults"></div><div class="list" id="friends"></div></div></div></div>
<div class="two"><div class="card"><div class="section-title">Challenges</div><div class="list" id="challenges"></div></div><div class="card"><div class="section-title">Achievements & cosmetics</div><div id="achievements" class="list"></div></div></div></main></div></div>
<script>
let csrf='';let profile=null;const $=s=>document.querySelector(s);const icons={pawn:'♟',knight:'♞',bishop:'♝',rook:'♜',queen:'♛',king:'♚',crown:'♛',flame:'🔥'};
async function api(url,options={}){options.credentials='same-origin';options.headers=Object.assign({'X-CSRF-Token':csrf},options.headers||{});const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Request failed');return d}
async function load(){const c=await fetch('/api/auth/csrf');csrf=(await c.json()).csrfToken||'';profile=await api('/api/profile/me');render();const ch=await api('/api/challenges');renderChallenges(ch);const f=await api('/api/friends');renderFriends(f);}
function render(){const s=profile.stats;$('#name').textContent=profile.username;$('#tier').textContent=`${s.tier} · ${s.provisional?'Placement':'Ranked'}`;$('#bio').textContent=profile.bio||'No bio yet.';$('#joined').textContent=profile.createdAt?`Member since ${new Date(profile.createdAt).toLocaleDateString()}`:'';$('#avatar').textContent=profile.avatarUrl?'':(icons[profile.avatarKey]||'♞');if(profile.avatarUrl){$('#avatar').style.backgroundImage=`url(${profile.avatarUrl})`;$('#avatar').style.backgroundSize='cover';$('#avatar').textContent=''}$('#mmr').textContent=s.mmr;$('#matches').textContent=s.matchesPlayed;$('#winrate').textContent=`${s.winRate}%`;$('#level').textContent=s.level;$('#history').innerHTML=profile.history.length?profile.history.map(h=>`<div class="row"><div><b>${h.opponent.username}</b><div class="muted">${new Date(h.createdAt).toLocaleString()} · ${h.reason}</div></div><div class="${h.result==='win'?'result-win':'result-loss'}">${h.result.toUpperCase()}<br><span class="muted">${h.mmrDelta>=0?'+':''}${h.mmrDelta} MMR</span></div></div>`).join(''):'<div class="empty">No ranked matches yet.</div>';$('#achievements').innerHTML=(profile.achievements||[]).length?profile.achievements.map(a=>`<div class="row"><b>${a.name||a.code}</b><span class="muted">${a.progress||''}</span></div>`).join(''):'<div class="empty">Achievements will appear as you play.</div>';drawGraph(profile.performance)}
function drawGraph(points){const c=$('#mmrGraph'),ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);if(!points.length){ctx.fillStyle='#94a3b8';ctx.fillText('Play ranked matches to build your graph.',20,35);return}const vals=points.map(p=>p.mmr),min=Math.min(...vals)-20,max=Math.max(...vals)+20;ctx.strokeStyle='#8b5cf6';ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>{const x=14+i*Math.max(0,(w-28)/Math.max(1,points.length-1));const y=h-18-(p.mmr-min)/(max-min)*(h-36);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function renderFriends(data){const box=$('#friends');box.innerHTML=data.friends.length?data.friends.map(f=>`<div class="row"><div><b>${f.user.username}</b><div class="muted">${f.status}</div></div>${f.status==='accepted'?`<button class="button" onclick="challenge(${f.user.id})">Challenge</button>`:''}</div>`).join(''):'<div class="empty">No friends yet.</div>'}
function renderChallenges(data){const all=[...data.incoming.map(x=>Object.assign({incoming:true},x)),...data.outgoing.map(x=>Object.assign({incoming:false},x))];$('#challenges').innerHTML=all.length?all.map(c=>`<div class="row"><div><b>${c.incoming?c.challenger.username:c.challenged.username}</b><div class="muted">${c.status}</div></div>${c.incoming&&c.status==='pending'?`<div class="challenge"><button class="button" onclick="respond(${c.id},'accept')">Accept</button><button class="button" onclick="respond(${c.id},'decline')">Decline</button></div>`:''}</div>`).join(''):'<div class="empty">No challenges.</div>'}
async function challenge(id){try{await api('/api/challenges',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:id})});const ch=await api('/api/challenges');renderChallenges(ch)}catch(e){alert(e.message)}}
async function respond(id,action){try{await api(`/api/challenges/${id}/${action}`,{method:'POST'});const ch=await api('/api/challenges');renderChallenges(ch)}catch(e){alert(e.message)}}
$('#friendSearch').oninput=async e=>{const q=e.target.value.trim();if(q.length<2){$('#friendResults').innerHTML='';return}const d=await api('/api/friends/search?q='+encodeURIComponent(q));$('#friendResults').innerHTML=d.users.map(u=>`<div class="row"><b>${u.username}</b><button class="button" onclick="addFriend(${u.id})">Add</button></div>`).join('')};
async function addFriend(id){try{await api('/api/friends/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:id})});$('#friendSearch').dispatchEvent(new Event('input'))}catch(e){alert(e.message)}}
async function editProfile(){const username=prompt('Username',profile.username);if(username===null)return;const bio=prompt('Bio',profile.bio||'');if(bio===null)return;try{await api('/api/profile/me',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,bio})});profile=await api('/api/profile/me');render()}catch(e){alert(e.message)}}
$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/login'};
load().catch(e=>{document.body.innerHTML=`<div style="padding:40px;color:#fecaca">${e.message}<br><br><a href="/login">Sign in</a></div>`});
</script></body></html>
